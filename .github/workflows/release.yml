name: Release
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:manifest
      - name: Verify release tag
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'const v = require("./manifest.json").version; if (process.env.TAG !== v) throw new Error("Tag must match manifest version exactly, without a v prefix");'
      - run: npm run prepare:release
      - uses: softprops/action-gh-release@v2.3.3
        with:
          files: |
            dist/gitlab-includes/main.js
            dist/gitlab-includes/manifest.json
            dist/gitlab-includes/styles.css
            dist/SHA256SUMS
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
